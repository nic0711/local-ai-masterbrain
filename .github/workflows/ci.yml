# Phase-1-Governance-CI. Siehe docs/adr/0007-release-and-update-strategy.md und
# docs/adr/0008-container-security.md fuer die zugrunde liegenden Entscheidungen.
#
# Grundsatz: keine `:latest`-Tags. Alle Actions sind per Commit-SHA gepinnt
# (Klartext-Version im Kommentar danebenstehend), alle Docker-Tool-Images per
# Digest. Bestehende Critical/High-Findings werden sichtbar gemacht, nicht
# pauschal unterdrueckt (siehe docs/planning/security-exceptions/).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint-yaml:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint (Workflow-Syntax)
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
      - name: yamllint (Compose- und Workflow-YAML)
        run: |
          docker run --rm -v "$PWD":/data \
            cytopia/yamllint@sha256:596fb19eb71e55ba5b2fa56d8c18a615ec82adc8d3bf2d73918cb78c8f3240fb \
            -d relaxed /data/.github/workflows /data/docker-compose.yml

  compose-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Supabase-Docker-Compose per Sparse-Checkout holen (wie start_services.py)
        # docker-compose.yml inkludiert ./supabase/docker/docker-compose.yml.
        # Dieses Verzeichnis ist kein Teil des Repos (siehe start_services.py:
        # clone_supabase_repo()), sondern wird zur Laufzeit per Sparse-Checkout
        # aus dem offiziellen Supabase-Repo geholt - hier read-only fuer die
        # reine Syntax-/Struktur-Pruefung repliziert.
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/supabase/supabase.git supabase
          git -C supabase sparse-checkout init --cone
          git -C supabase sparse-checkout set docker
          git -C supabase checkout master
      - name: Temporaere, nicht-produktive .env.ci erzeugen
        run: cp .env.example .env.ci
      - name: docker compose config
        run: docker compose --env-file .env.ci -f docker-compose.yml config -q
      - name: .env.ci wieder loeschen
        if: always()
        run: rm -f .env.ci

  check-image-pinning:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Third-Party-Images gegen Baseline pruefen
        run: bash scripts/ci/check-image-pinning.sh

  check-dockerignore:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pflicht-Ausschlussmuster in .dockerignore pruefen
        run: bash scripts/ci/check-dockerignore.sh

  build-custom-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # auth-gateway zuerst (leichtestes Custom Image), Matrix deckt weiterhin alle vier ab.
        service: [auth-gateway, python-nlp-service, ocr-service, tts-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ${{ matrix.service }} (kein Push)
        # auth-gateway (Phase 2A) und python-nlp-service (Phase 2B): Build-
        # Context = Repo-Root, eigener Dockerfile-Pfad, GIT_COMMIT-Build-Arg
        # (fuer /version) - siehe docker-compose.yml. ocr-service/tts-service
        # bauen weiterhin mit ihrem eigenen Verzeichnis als Context (Phase 2C).
        run: |
          if [ "${{ matrix.service }}" = "auth-gateway" ] || [ "${{ matrix.service }}" = "python-nlp-service" ]; then
            docker build -f "${{ matrix.service }}/Dockerfile" \
              --build-arg GIT_COMMIT="${{ github.sha }}" \
              -t "ci-local/${{ matrix.service }}:${{ github.sha }}" .
          else
            docker build -t "ci-local/${{ matrix.service }}:${{ github.sha }}" "./${{ matrix.service }}"
          fi
      - name: Image-Digest ermitteln
        id: digest
        run: |
          digest=$(docker inspect --format='{{index .Id}}' "ci-local/${{ matrix.service }}:${{ github.sha }}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Image als Tarball fuer nachgelagerte Jobs sichern
        run: docker save "ci-local/${{ matrix.service }}:${{ github.sha }}" -o "${{ matrix.service }}.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.tar
          retention-days: 1

  test-presence-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test-Verzeichnisse je Custom Service pruefen
        run: |
          missing=0
          for svc in auth-gateway python-nlp-service ocr-service tts-service; do
            if [ -d "$svc/tests" ]; then
              echo "OK: $svc hat ein tests/-Verzeichnis"
            else
              echo "LUECKE: $svc hat KEIN tests/-Verzeichnis (siehe docs/planning/test-coverage-gaps.md)"
              if [ "$svc" != "tts-service" ]; then
                # tts-service ist die bekannte, dokumentierte Phase-2-Abweichung.
                # Jede andere fehlende Testabdeckung waere ein neuer, ungeplanter Befund.
                missing=1
              fi
            fi
          done
          exit "$missing"

  component-tests:
    # ocr-service ist bewusst NICHT in dieser Matrix: die vorhandene Testsuite
    # kann aktuell nicht kollidieren-frei laufen, weil requirements.txt httpx
    # ungepinnt laesst, was mit dem gepinnten fastapi==0.104.1/starlette==0.27.0
    # kollidiert (TypeError: Client.__init__() got an unexpected keyword
    # argument 'app'). Real, reproduzierbar sowohl lokal als auch im gebauten
    # Custom Image festgestellt - siehe docs/planning/test-coverage-gaps.md.
    # Behebung (Dependency-Pinning) ist Phase-2-Scope, nicht Teil dieses PR.
    needs: [build-custom-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: [auth-gateway, python-nlp-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: masterbrain-common installieren (auth-gateway, python-nlp-service)
        if: matrix.service == 'auth-gateway' || matrix.service == 'python-nlp-service'
        run: python3 -m pip install ./packages/python/masterbrain-common
      - name: Abhaengigkeiten installieren und Tests ausfuehren
        working-directory: ${{ matrix.service }}
        env:
          # Nur Test-Dummy-Werte, keine echten Secrets. python-nlp-service
          # verlangt NEO4J_AUTH bereits beim Modul-Import (app.py).
          NEO4J_AUTH: "neo4j/test-dummy-password"
        run: |
          python3 -m pip install --require-hashes -r requirements.lock.txt -r requirements-test.lock.txt
          python3 -m pytest -q

  masterbrain-common-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: masterbrain-common editable installieren und Tests ausfuehren
        working-directory: packages/python/masterbrain-common
        run: |
          python3 -m pip install -e . pytest
          python3 -m pytest -q

  auth-gateway-smoke-test:
    # Leichtgewichtiger Container-Smoke-Test (kein ML, echte Container-
    # Importtests statt vollem Modell-Boot): Image starten, /health, /ready,
    # /version real abfragen, wieder stoppen.
    needs: [build-custom-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-auth-gateway
      - name: Image laden
        run: docker load -i auth-gateway.tar
      - name: Container starten
        run: |
          docker run -d --name auth-gateway-smoke \
            --cap-drop=ALL --security-opt no-new-privileges:true \
            -e SUPABASE_URL=http://fake-supabase \
            -e SUPABASE_SERVICE_ROLE_KEY=fake-key \
            -e JWT_SECRET=ci-smoke-test-secret-not-a-real-secret \
            -p 15001:5001 \
            "ci-local/auth-gateway:${{ github.sha }}"
          sleep 3
      - name: /health, /ready, /version pruefen
        run: |
          curl -sf http://localhost:15001/health
          curl -sf http://localhost:15001/ready | tee /dev/stderr | grep -q '"status":"ready"'
          curl -sf http://localhost:15001/version | tee /dev/stderr | grep -q '"service":"auth-gateway"'
      - name: Container-Logs bei Fehlschlag zeigen
        if: failure()
        run: docker logs auth-gateway-smoke
      - name: Aufraeumen
        if: always()
        run: docker rm -f auth-gateway-smoke || true

  python-nlp-service-smoke-test:
    # Analog auth-gateway-smoke-test (s.o.). Kein Neo4j-Testcontainer in
    # diesem Job - /ready wird deshalb bewusst NICHT auf status=ready
    # geprueft (haette in CI legitim 503/not_ready zur Folge), sondern nur
    # auf eine gueltige JSON-Antwortstruktur.
    needs: [build-custom-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-python-nlp-service
      - name: Image laden
        run: docker load -i python-nlp-service.tar
      - name: Container starten
        run: |
          docker run -d --name python-nlp-service-smoke \
            --cap-drop=ALL --security-opt no-new-privileges:true \
            -e NEO4J_AUTH=neo4j/ci-smoke-test-password-not-real \
            -p 15000:5000 \
            "ci-local/python-nlp-service:${{ github.sha }}"
      - name: Warten bis Service healthy ist (spaCy-Modelle laden beim Start)
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:15000/health >/dev/null 2>&1; then
              echo "Service healthy nach $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "Service nicht healthy nach 60s"
          docker logs python-nlp-service-smoke
          exit 1
      - name: /health, /ready, /version pruefen
        run: |
          curl -sf http://localhost:15000/health
          curl -s http://localhost:15000/ready | tee /dev/stderr | grep -qE '"status":"(ready|not_ready)"'
          curl -sf http://localhost:15000/version | tee /dev/stderr | grep -q '"service":"python-nlp-service"'
      - name: Container-Logs bei Fehlschlag zeigen
        if: failure()
        run: docker logs python-nlp-service-smoke
      - name: Aufraeumen
        if: always()
        run: docker rm -f python-nlp-service-smoke || true

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: gitleaks (aktueller Dateiinhalt, redigierte Ausgabe, Baseline fuer bekannte Bestandsfunde)
        # --no-git: scannt den ausgecheckten Dateiinhalt, NICHT die
        # Git-Historie. Ein Git-History-Scan (gitleaks detect ohne --no-git)
        # ordnet Funde einzelnen Commits zu (Fingerprint enthaelt die
        # Commit-SHA); bei pull_request-Triggern aendert sich diese Zuordnung
        # jedoch von Lauf zu Lauf (GitHub erzeugt bei jedem Lauf einen neuen
        # synthetischen refs/pull/N/merge-Commit, und bereits mehrfach in der
        # Historie vorkommender Inhalt wird davon abhaengig einem anderen
        # Commit zugeordnet) - das macht eine commit-basierte Baseline
        # instabil. Der Dateiinhalt-Scan ist unabhaengig davon stabil, siehe
        # docs/planning/gitleaks-baseline.md. Bekannte Bestandsfunde im
        # aktuellen Dateiinhalt werden nicht erneut blockierend gemeldet -
        # NEUE Secrets im Dateiinhalt werden weiterhin sofort erkannt.
        run: |
          docker run --rm -v "$PWD":/repo \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --no-git --baseline-path /repo/docs/planning/gitleaks-baseline.json -v --redact

  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy Filesystem-Scan (JSON, fuer strukturierte Ausnahmepruefung)
        # hermes-agent/ und supabase/ sind Submodule mit eigener Upstream-CI
        # und -Governance (siehe docs/planning/documentation-inventory.md);
        # *_storage/, shared/, neo4j/, backups/, volumes/ sind Laufzeitdaten,
        # kein Repo-Code. Ausschluss deckt sich mit dem Phase-1-Scope.
        run: |
          docker run --rm -v "$PWD":/repo \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            fs --format json --output /repo/trivy-fs-report.json --severity CRITICAL,HIGH \
            --skip-dirs /repo/hermes-agent,/repo/supabase,/repo/neo4j,/repo/shared,/repo/tts_storage,/repo/ocr_storage,/repo/backups,/repo/volumes \
            /repo
      - name: Trivy Filesystem-Scan (SARIF, fuer Code Scanning)
        run: |
          docker run --rm -v "$PWD":/repo \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            fs --format sarif --output /repo/trivy-fs.sarif --severity CRITICAL,HIGH \
            --skip-dirs /repo/hermes-agent,/repo/supabase,/repo/neo4j,/repo/shared,/repo/tts_storage,/repo/ocr_storage,/repo/backups,/repo/volumes \
            /repo
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - name: Findings gegen strukturierte Ausnahmen bewerten (Critical/High sichtbar, blockierend ohne Ausnahme)
        run: python3 scripts/ci/check-trivy-findings.py --report trivy-fs-report.json --component repo-fs
      - name: SARIF hochladen
        if: always()
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  security-exception-approval:
    # Prueft echte GitHub-PR-Reviews gegen den aktuellen head_sha, um
    # Security-Ausnahmen freizugeben - siehe scripts/ci/check-exception-approvals.py
    # fuer die Begruendung (ersetzt ein fruehers Feld-basiertes Modell, das
    # einen Freigabe-Deadlock durch Branch-Protection-Stale-Dismissal erzeugte).
    # Nur im PR-Kontext sinnvoll (Reviews existieren nur auf einem offenen PR).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - name: Echte PR-Reviews gegen aktuellen head_sha pruefen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/check-exception-approvals.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: approved-exceptions
          path: approved-exceptions.json
          retention-days: 1

  trivy-image:
    needs: [build-custom-images, security-exception-approval]
    # security-exception-approval laeuft nur bei pull_request (s.o.) - bei
    # push/workflow_dispatch wird er uebersprungen. `always()` verhindert,
    # dass dieser Job dadurch ebenfalls uebersprungen wird; der eigentliche
    # Erfolg von build-custom-images bleibt Pflicht.
    if: always() && needs.build-custom-images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [auth-gateway, python-nlp-service, ocr-service, tts-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.service }}
      - name: Image laden
        run: docker load -i "${{ matrix.service }}.tar"
      - name: Image-Digest ermitteln
        id: digest
        run: |
          digest=$(docker inspect --format='{{index .Id}}' "ci-local/${{ matrix.service }}:${{ github.sha }}")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Trivy Image-Scan (JSON)
        # WICHTIG: $PWD muss zusaetzlich zum Docker-Socket gemountet werden -
        # sonst schreibt --output in das (nach --rm verworfene) Dateisystem
        # des Trivy-Containers selbst, nicht auf den Runner-Host.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/out \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --format json --output "/out/${{ matrix.service }}-image-report.json" \
            --severity CRITICAL,HIGH "ci-local/${{ matrix.service }}:${{ github.sha }}"
      - name: Trivy Image-Scan (SARIF)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD":/out \
            aquasec/trivy@sha256:7cced7cae583819fc7806d4cbc0dbbc7cad18b99f7d3e235192e6da8c091045c \
            image --format sarif --output "/out/${{ matrix.service }}-image.sarif" \
            --severity CRITICAL,HIGH "ci-local/${{ matrix.service }}:${{ github.sha }}"
      - name: Vollstaendigen Report als Workflow-Artefakt sichern
        # Ersetzt den frueheren SARIF-Upload nach GitHub Code Scanning fuer
        # trivy-image (entfernt): Container-Paket-CVEs
        # sind kein Code-Scanning-Finding im eigentlichen Sinn und haben den
        # Security-Tab mit tausenden Alerts ueberladen (Bestandsfindings aus
        # EOL-Basis-Images/ungepinnten Deps, keine neuen Probleme). JSON+SARIF
        # bleiben vollstaendig erhalten, nur als Artefakt statt als Alert.
        id: upload-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report-${{ matrix.service }}
          path: |
            ${{ matrix.service }}-image-report.json
            ${{ matrix.service }}-image.sarif
          retention-days: 14
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -m pip install pyyaml
      - name: Freigegebene Ausnahmen laden (falls vorhanden)
        # continue-on-error: das Artifact existiert nur, wenn
        # security-exception-approval tatsaechlich gelaufen ist (pull_request).
        # Fehlt es (push/workflow_dispatch), bleibt check-trivy-findings.py
        # fail-closed - keine Ausnahme wird angewendet.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: approved-exceptions
      - name: Findings gegen strukturierte, freigegebene Ausnahmen bewerten
        # Trivy-Severity-Filter (--severity CRITICAL,HIGH beim Scan oben),
        # Ausnahmeprozess und Exit-Code-Verhalten sind unveraendert - dieser
        # Schritt schreibt zusaetzlich eine kompakte GitHub-Step-Summary mit
        # Critical/High/fixable-Zaehlung und Link zum Artefakt.
        run: |
          args=(--report "${{ matrix.service }}-image-report.json"
                --component "${{ matrix.service }}"
                --image-digest "${{ steps.digest.outputs.digest }}"
                --artifact-name "trivy-report-${{ matrix.service }}"
                --artifact-url "${{ steps.upload-report.outputs.artifact-url }}")
          if [ -f approved-exceptions.json ]; then
            args+=(--approved-exceptions-file approved-exceptions.json)
          fi
          python3 scripts/ci/check-trivy-findings.py "${args[@]}"

  sbom-cyclonedx:
    needs: [build-custom-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [auth-gateway, python-nlp-service, ocr-service, tts-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ matrix.service }}
      - run: docker load -i "${{ matrix.service }}.tar"
      - name: CycloneDX-SBOM erzeugen
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: "ci-local/${{ matrix.service }}:${{ github.sha }}"
          format: cyclonedx-json
          output-file: "${{ matrix.service }}-sbom.cdx.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.service }}
          path: ${{ matrix.service }}-sbom.cdx.json
          retention-days: 14

  validate-exceptions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
