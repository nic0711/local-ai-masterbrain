# Vorlage fuer eine strukturierte Security-Ausnahme.
#
# Diese Vorlage wird NICHT direkt verwendet, um eine Ausnahme zu "genehmigen" -
# eine hier eingetragene approvals-Liste ist KEINE gueltige Freigabe.
# Verbindliche Freigaben entstehen ausschliesslich ueber echte GitHub-PR-Reviews
# auf die konkrete Ausnahmedatei unter docs/planning/security-exceptions/,
# durchgesetzt durch Branch-Schutzregeln + CODEOWNERS.
#
# scripts/ci/validate-exceptions.py prueft NUR:
#   - sind alle Pflichtfelder vorhanden?
#   - liegt expires_on in der Zukunft?
#   - ist requested_by nicht der einzige "Nachweis" einer Freigabe?
#   - passt severity zur Mindestanzahl in approvals (nur strukturelle Zaehlung,
#     keine Aussage ueber Echtheit der Freigabe)
#
# Fuer Trivy-Findings gelten zusaetzlich die Felder cve/package/installed_version/
# affected_image_digest.

id: "" # eindeutige, sprechende ID, z.B. "2026-08-ocr-service-CVE-XXXX-XXXXX"
finding_id: "" # z.B. Trivy-Finding-ID oder CVE
component: "" # z.B. "ocr-service"
severity: "" # "critical" | "high"

# Nur bei Trivy-/Image-Findings zusaetzlich ausfuellen:
cve: ""
package: ""
installed_version: ""
affected_image_digest: ""

reason: "" # warum ist die Ausnahme notwendig
owner: "" # verantwortliche Person/Team fuer die Behebung
mitigation: "" # Kompensationsmassnahme bis zur Behebung
requested_by: "" # wer hat die Ausnahme beantragt (darf NICHT selbst freigeben)

# Struktur-Feld, keine Freigabe-Ersatz. Reale Freigabe = github_approval_ref.
approvals: []

expires_on: "" # ISO-8601-Datum, muss in der Zukunft liegen
github_approval_ref: "" # Link auf den PR/Review, der diese Ausnahme tatsaechlich freigegeben hat
