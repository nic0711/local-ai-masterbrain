# Vorlage fuer eine strukturierte Security-Ausnahme.
#
# Freigabe-Modell (korrigiert, siehe docs/handbook/09-verantwortlichkeiten.md):
# Diese Datei enthaelt KEIN Freigabe-Feld mehr. Eine fruehere Version verlangte
# einen `github_approval_ref`, der erst NACH einem PR-Review in diese Datei
# committet werden musste - das erzeugte einen Deadlock, weil ein neuer Commit
# (der die Referenz eintraegt) bestehende Freigaben unter aktiver
# Branch-Protection wieder zuruecksetzt und die Freigabe damit durch ihre
# eigene Dokumentation ungueltig machte.
#
# Stattdessen: scripts/ci/check-exception-approvals.py fragt zur Laufzeit
# echte GitHub-PR-Reviews auf den AKTUELLEN head_sha des PR ab (GitHub REST
# API, keine gespeicherte Referenz). Notwendige Freigaben: High = 1, Critical
# = 2, jeweils unabhaengige Reviewer (weder PR-Autor noch requested_by).
# Ergebnis wird als approved-exceptions.json an den trivy-image-Job
# weitergereicht - nichts davon wird in diese Datei zurueckgeschrieben.
#
# scripts/ci/validate-exceptions.py prueft nur noch:
#   - sind alle Pflichtfelder vorhanden?
#   - ist severity gueltig (critical|high)?
#   - liegt expires_on in der Zukunft?
#
# Fuer Trivy-Findings gelten zusaetzlich die Felder cve/package/installed_version/
# affected_image_digest.

id: "" # eindeutige, sprechende ID, z.B. "2026-08-ocr-service-CVE-XXXX-XXXXX"
finding_id: "" # z.B. Trivy-Finding-ID oder CVE
component: "" # z.B. "ocr-service"
severity: "" # "critical" | "high"

# Nur bei Trivy-/Image-Findings zusaetzlich ausfuellen:
cve: ""
package: ""
installed_version: ""
affected_image_digest: ""

reason: "" # warum ist die Ausnahme notwendig
owner: "" # verantwortliche Person/Team fuer die Behebung
mitigation: "" # Kompensationsmassnahme bis zur Behebung
requested_by: "" # wer hat die Ausnahme beantragt (zaehlt nicht als Freigabe-Reviewer)

expires_on: "" # ISO-8601-Datum, muss in der Zukunft liegen
