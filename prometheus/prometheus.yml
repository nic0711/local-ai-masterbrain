global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus selbst
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Host-Metriken (CPU, RAM, Disk, Netzwerk)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Docker-Container-Metriken
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Pushgateway: n8n-Workflows und externe Metriken (O365, Solar, SPS)
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # IT-Monitoring: Blackbox Exporter, HTTP-Verfuegbarkeitschecks.
  # Targets folgen in einer spaeteren Phase (User-Input) - noch leer.
  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: []
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target__
      - source_labels: [__param_target__]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # IT-Monitoring: Blackbox Exporter, reine TCP-Port-Checks.
  # Targets folgen in einer spaeteren Phase (User-Input) - noch leer.
  - job_name: "blackbox-tcp"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: []
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target__
      - source_labels: [__param_target__]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # SPS: MQTT → Prometheus (mqtt2prometheus)
  - job_name: "mqtt2prometheus"
    static_configs:
      - targets: ["mqtt2prometheus:9641"]

  # SPS: Modbus TCP → Prometheus
  - job_name: "modbus-exporter"
    static_configs:
      - targets: ["modbus-exporter:9602"]
