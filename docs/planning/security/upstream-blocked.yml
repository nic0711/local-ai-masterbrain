  # frischer Rebuild + `grep -aoE 'go1\.[0-9]+(\.[0-9]+)?'
  # /usr/libexec/docker/cli-plugins/docker-compose` (go1.26.6, das Binary
  # selbst ist bereits gegen einen neueren Go-Compiler gebaut - das aendert
  # aber nichts an der separat vendorten github.com/docker/docker-Modul-
  # version, die unabhaengig vom Compiler-Release ist) + Trivy-Rescan mit
  # identischer Trivy-DB, Finding unveraendert.
  - component: auth-gateway
    cve: CVE-2026-34040
    direct_package: docker-compose-plugin
    installed_package_version: "5.5.0-1~debian.12~bookworm"
    upstream_component: github.com/docker/docker
    vulnerable_version: v28.5.2+incompatible
    fixed_version: "29.3.1"
    package_source: "https://download.docker.com/linux/debian bookworm/stable (offizielles Docker-Debian-Repo)"
    verified_on: "2026-08-24"
    evidence: >
      apt-cache madison docker-compose-plugin (neueste Version
      5.5.0-1~debian.12~bookworm) + frischer Rebuild + Trivy-Rescan mit
